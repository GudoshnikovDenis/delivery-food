# Kerberos SSO via reverse proxy: trust headers from front proxy and expose REMOTE_USER to PHP-FPM
# This file is included by Bitnami Moodle's Apache at startup (see entrypoint script).

# Verbose logging for diagnostics (can be tuned down later)
LogLevel core:info headers:info rewrite:trace2 proxy_fcgi:info

# Safer header handling: only trust when explicitly marked by proxy
SetEnvIfNoCase X-Trusted-Proxy "^1$" trusted_proxy=1
RequestHeader unset X-Auth-User env=!trusted_proxy

# Map X-Auth-User to REMOTE_USER for PHP-FPM (visible to Moodle auth_webserver)
# Also propagate a copy to HTTP_X_AUTH_USER for easier inspection
ProxyFCGISetEnvIf X-Auth-User "^(.+)$" REMOTE_USER=$1
ProxyFCGISetEnvIf X-Auth-User "^(.+)$" HTTP_X_AUTH_USER=$1

# Extended access log format to verify headers reach Apache
LogFormat "vhost=%v ip=%a user=%u ru_env=%{REMOTE_USER}e xauth=%{X-Auth-User}i xproxy=%{X-Trusted-Proxy}i ua=\"%{User-Agent}i\"" vcombined_plus
CustomLog "/opt/bitnami/apache/logs/access_plus.log" vcombined_plus

# Magic URL for spot-checking REMOTE_USER without hitting PHP
SetEnvIf Request_URI "^/sso-check$" is_sso_check=1
LogFormat "SSOCHK ip=%a user=%u ru_env=%{REMOTE_USER}e xauth=%{X-Auth-User}i trusted=%{X-Trusted-Proxy}i" ssofmt
CustomLog "/opt/bitnami/apache/logs/sso_check.log" ssofmt env=is_sso_check

